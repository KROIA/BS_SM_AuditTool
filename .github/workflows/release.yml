# Builds the installer and the portable zip on Windows, tests them, and attaches them to a GitHub release.
# Runs when a v* tag is pushed. For a tag pushed before this file existed, start it by hand
# (Actions, Release, Run workflow) with the tag name.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag matches the version in package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm run check
      - run: npm test
      - run: npm run dist -- --publish never
      - run: npm run test:release
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" release/*.exe release/*.zip --title "Audit Tool ${TAG#v}" --generate-notes
